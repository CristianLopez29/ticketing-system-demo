; Production PHP settings. display_errors and expose_php are the two that matter for
; security: the first keeps stack traces off the wire, the second removes the
; X-Powered-By header that advertises the exact PHP patch level.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M
max_execution_time = 30

; validate_timestamps=0 means the image is the unit of deployment: code changes require a
; rebuild, never an edit inside a running container.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
