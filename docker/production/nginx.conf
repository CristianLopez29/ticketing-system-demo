server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 8M;
    server_tokens off;

    # Volumetric limit in front of PHP. The application throttles are per user and per
    # email and cannot be expressed here; this one keeps working when PHP-FPM has no
    # free workers left, which is exactly when the application limiter stops answering.
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr error;
}
