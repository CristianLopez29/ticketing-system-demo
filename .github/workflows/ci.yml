name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: sail
      DB_PASSWORD: password
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      APP_ENV: testing
      APP_DEBUG: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pdo_mysql, redis
          coverage: pcov

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress || composer update --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      # phpunit rather than `php artisan test`: the artisan wrapper accepts
      # --coverage-clover but never writes the file, so coverage would be silently
      # empty. Same suites, same bootstrap, one run instead of two.
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      # fail_ci_if_error stays false on purpose: a Codecov outage, or a pull request
      # from a fork (where secrets are not exposed), must not turn the test gate red.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Keep the coverage report as an artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-clover
          path: coverage.xml
          retention-days: 14
